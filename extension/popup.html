<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 220px; font: 13px/1.4 system-ui, sans-serif; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 8px; background: #58a6ff; color: #001; font-weight: 600; cursor: pointer; }
    a { display: block; margin-top: 10px; font-size: 12px; color: #58a6ff; }
    .usage { margin-top: 10px; color: #4b5563; font-size: 12px; line-height: 1.5; }
    .usage p { margin: 0 0 6px; }
  </style>
</head>
<body>
  <h1>🪝🚫 <span data-i18n="brand">debait</span></h1>
  <button id="go" data-i18n="popupAnalyze">Analyze this page</button>
  <div class="usage">
    <p data-i18n="popupHintAnalyze">Analyze the article you're viewing.</p>
    <p data-i18n="popupHintLinks">Preview a link: hold Alt and hover, or right-click → debait this link.</p>
    <p data-i18n="popupHintSetup">First use? Set your provider and API key (if needed) in Settings below.</p>
  </div>
  <a href="#" id="opts" data-i18n="popupSettings">Settings (API key)</a>
  <script src="messages.gen.js"></script>
  <script src="i18n-runtime.js"></script>
  <script src="popup.js"></script>
</body>
</html>
