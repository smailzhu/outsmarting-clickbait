<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 16px; padding: 8px 16px; border: none; border-radius: 6px; background: #58a6ff; color: #001; font-weight: 600; cursor: pointer; }
    .hint { color: #777; font-size: 12px; }
    #status { color: #30a46c; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>🪝🚫 debait settings</h1>
  <p class="hint">Your API key is stored in <code>chrome.storage.sync</code> and only sent to the endpoint below.</p>
  <label for="key">OpenAI API key</label>
  <input id="key" type="password" placeholder="sk-..." />
  <label for="base">API base URL</label>
  <input id="base" type="text" placeholder="https://api.openai.com/v1" />
  <label for="model">Model</label>
  <input id="model" type="text" placeholder="gpt-4o-mini" />
  <div>
    <button id="save">Save</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
