<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 16px; padding: 8px 16px; border: none; border-radius: 6px; background: #58a6ff; color: #001; font-weight: 600; cursor: pointer; }
    .hint { color: #777; font-size: 12px; }
    #status { color: #30a46c; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>🪝🚫 <span data-i18n="optTitle">debait settings</span></h1>
  <p class="hint" data-i18n="optStoredHint">Your API key is stored in chrome.storage.sync and only sent to the selected provider.</p>
  <label for="provider" data-i18n="optProvider">Provider</label>
  <select id="provider" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px">
    <option value="openai">OpenAI</option>
    <option value="anthropic">Anthropic (Claude)</option>
    <option value="gemini">Google Gemini</option>
    <option value="groq">Groq</option>
    <option value="openrouter">OpenRouter</option>
    <option value="deepseek">DeepSeek</option>
    <option value="xai">xAI (Grok)</option>
    <option value="mistral">Mistral</option>
    <option value="together">Together</option>
    <option value="nvidia">NVIDIA (NIM / build.nvidia.com)</option>
    <option value="ollama">Ollama (local)</option>
  </select>
  <label for="key" data-i18n="optKey">API key</label>
  <input id="key" type="password" data-i18n-ph="phKeyOllama" placeholder="sk-... (not needed for local Ollama)" />
  <label for="base"><span data-i18n="optBase">API base URL</span> <span class="hint" data-i18n="optOverrideHint">(optional — overrides provider default)</span></label>
  <input id="base" type="text" data-i18n-ph="phBlankDefault" placeholder="leave blank for default" />
  <label for="model"><span data-i18n="optModel">Model</span> <span class="hint" data-i18n="optOverrideHint">(optional — overrides provider default)</span></label>
  <input id="model" type="text" data-i18n-ph="phBlankDefault" placeholder="leave blank for default" />
  <label for="language"><span data-i18n="optLanguage">Output language</span> <span class="hint" data-i18n="optLanguageHint">(title &amp; summary; blank = auto, match the article)</span></label>
  <input id="language" type="text" placeholder="auto — or English, 繁體中文, 日本語, Español" />
  <label for="customInstructions"><span data-i18n="optInstructions">Custom instructions</span> <span class="hint" data-i18n="optInstructionsHint">(optional — appended to the prompt; the JSON output shape is kept)</span></label>
  <textarea id="customInstructions" rows="3" style="width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font:13px/1.4 system-ui,sans-serif" placeholder="e.g. Be harsher on sensational framing. Add a one-line TL;DR in the summary."></textarea>

  <h2 style="font-size:15px;margin:22px 0 4px" data-i18n="optLimitsTitle">Hover preview limits</h2>
  <p class="hint" data-i18n="optLimitsHint">Preview fetches + summarizes a link before you click. These caps stop bursty hovering from blowing your provider quota.</p>
  <label for="previewDwellMs"><span data-i18n="optDwell">Hover dwell (ms)</span> <span class="hint" data-i18n="optDwellHint">before a preview fires</span></label>
  <input id="previewDwellMs" type="number" min="0" step="50" placeholder="500" />
  <label for="previewMinIntervalMs" data-i18n="optInterval">Min interval between previews (ms)</label>
  <input id="previewMinIntervalMs" type="number" min="0" step="100" placeholder="1500" />
  <label for="dailyCap"><span data-i18n="optDailyCap">Daily preview cap</span> <span class="hint" data-i18n="optDailyCapHint">(0 = unlimited)</span></label>
  <input id="dailyCap" type="number" min="0" step="10" placeholder="200" />
  <p class="hint" id="usage"></p>

  <div style="margin-top:16px">
    <button id="save" data-i18n="optSave">Save</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
