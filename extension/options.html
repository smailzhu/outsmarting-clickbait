<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 16px; padding: 8px 16px; border: none; border-radius: 6px; background: #58a6ff; color: #001; font-weight: 600; cursor: pointer; }
    .hint { color: #777; font-size: 12px; }
    #status { color: #30a46c; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>🪝🚫 debait settings</h1>
  <p class="hint">Your API key is stored in <code>chrome.storage.sync</code> and only sent to the selected provider.</p>
  <label for="provider">Provider</label>
  <select id="provider" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px">
    <option value="openai">OpenAI</option>
    <option value="anthropic">Anthropic (Claude)</option>
    <option value="gemini">Google Gemini</option>
    <option value="groq">Groq</option>
    <option value="openrouter">OpenRouter</option>
    <option value="deepseek">DeepSeek</option>
    <option value="xai">xAI (Grok)</option>
    <option value="mistral">Mistral</option>
    <option value="together">Together</option>
    <option value="nvidia">NVIDIA (NIM / build.nvidia.com)</option>
    <option value="ollama">Ollama (local)</option>
  </select>
  <label for="key">API key</label>
  <input id="key" type="password" placeholder="sk-... (not needed for local Ollama)" />
  <label for="base">API base URL <span class="hint">(optional — overrides provider default)</span></label>
  <input id="base" type="text" placeholder="leave blank for default" />
  <label for="model">Model <span class="hint">(optional — overrides provider default)</span></label>
  <input id="model" type="text" placeholder="leave blank for default" />
  <label for="language">Output language <span class="hint">(title &amp; summary; blank = auto, match the article)</span></label>
  <input id="language" type="text" placeholder="auto — or English, 繁體中文, 日本語, Español" />
  <div>
    <button id="save">Save</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
