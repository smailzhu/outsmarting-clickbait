name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Verify shared/ ↔ extension/ copies are in sync
        run: |
          npm run sync
          if [ -n "$(git status --porcelain -- extension/)" ]; then
            echo "::error::extension/ copies are out of sync with shared/. Run 'npm run sync' and commit."
            git --no-pager status --porcelain -- extension/
            git --no-pager diff -- extension/
            exit 1
          fi
